# temptw.cosmicps.com 临时域名（HTTPS + 手机 GPS 需要安全上下文）
server {
    listen 80;
    listen [::]:80;
    server_name temptw.cosmicps.com;

    root /www/wwwroot/tianwang;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/tianwang;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name temptw.cosmicps.com;

    ssl_certificate     /root/.acme.sh/temptw.cosmicps.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/temptw.cosmicps.com_ecc/temptw.cosmicps.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /www/wwwroot/tianwang;
    client_max_body_size 50m;

    # 允许页面使用 GPS（部分浏览器会参考此头）
    add_header Permissions-Policy "geolocation=(self)" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /admin {
        return 302 /?view=admin;
    }

    location /api/daily-log/export {
        proxy_pass http://127.0.0.1:8080/api/daily-log/export;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        alias /lhcos-data/tianwang/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /files/ {
        alias /lhcos-data/tianwang/;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|ico|webp)$ {
        expires 7d;
    }

    location ~ .*\.(js|css)?$ {
        expires 1h;
    }

    access_log /www/wwwlogs/tianwang_temptw_access.log;
    error_log /www/wwwlogs/tianwang_temptw_error.log;
}
