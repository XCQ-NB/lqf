server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 123.207.10.114 _;

    root /www/wwwroot/tianwang;
    client_max_body_size 50m;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /admin {
        return 302 /?view=admin;
    }

    location /api/daily-log/export {
        proxy_pass http://127.0.0.1:8080/api/daily-log/export;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        alias /lhcos-data/tianwang/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /files/ {
        alias /lhcos-data/tianwang/;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|ico|webp)$ {
        expires 7d;
    }

    location ~ .*\.(js|css)?$ {
        expires 1h;
    }

    access_log /www/wwwlogs/tianwang_access.log;
    error_log /www/wwwlogs/tianwang_error.log;
}
