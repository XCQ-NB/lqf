<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天网运维</title>
<style>
  body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0d47a1;color:#fff;font-family:-apple-system,sans-serif}
  .loading{text-align:center;font-size:14px;opacity:.9}
</style>
</head>
<body>
<div class="loading" id="loadingText">正在加载天网运维...</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var view = params.get('view');
  var page;
  if (view === 'mobile') page = 'mobile.html';
  else if (view === 'admin') page = 'admin.html';
  else {
    var ua = navigator.userAgent || '';
    var isMobile = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger|webOS|BlackBerry/i.test(ua)
      || (window.innerWidth < 768 && 'ontouchstart' in window);
    page = isMobile ? 'mobile.html' : 'admin.html';
  }
  var cleanUrl = '/' + (view ? ('?view=' + view) : '');

  fetch('/' + page, { cache: 'no-store', redirect: 'manual' })
    .then(function(r){
      if (r.type === 'opaqueredirect' || r.status === 301 || r.status === 302) throw new Error('redirect');
      if (!r.ok) throw new Error('load failed');
      return r.text();
    })
    .then(function(html){
      if (html.indexOf('正在加载天网运维') >= 0 && html.indexOf('fetch(') >= 0) throw new Error('loop');
      history.replaceState(null, '', cleanUrl);
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){
      document.getElementById('loadingText').textContent = '加载失败，正在重试...';
      location.replace('/' + page);
    });
})();
</script>
</body>
</html>
